name: build-test-deploy-next.js-app

on: push

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: use node.js
        uses: actions/setup@4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm build
      


